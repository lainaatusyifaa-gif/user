
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WashUp Laundry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-box">
            <h1>Wash<span>Up.</span></h1>
            <h2>Selamat Datang!</h2>
            <p>Login untuk melanjutkan ke dashboard kamu.</p>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Masukkan email" required>

                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan password" required>

                <button type="submit">Login</button>
            </form>

            <p class="auth-link">
                Belum punya akun?
                <a href="register.html">Daftar sekarang</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
